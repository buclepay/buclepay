name: buclepay_checkout
description: Opens the buclePay checkout in a system sheet on top of your Flutter app (SFSafariViewController / Custom Tabs) and returns through a deep link.
homepage: https://buclepay.com
repository: https://github.com/buclepay/buclepay/tree/main/sdk/flutter
issue_tracker: https://github.com/buclepay/buclepay/issues
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
